[package]
edition = "2021"
name = "leveldb"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
miniz_oxide = "0.7.4"
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.3.0", default-features = false, features = ["napi4"] }
napi-derive = "3.2.5"
rusty-leveldb = "4.0.0"
once_cell = "1"

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
strip = "symbols"
