
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name    = "leveldb_upgrade"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
miniz_oxide = "0.9.1"
napi = { version = "3.8.4", default-features = false, features = [
  "napi4",
  "tokio_rt",
] }
napi-derive = "3.5.3"
once_cell = "1.21.4"
rusty-leveldb = "4.0.0"
tokio = "1.51.0"


[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
