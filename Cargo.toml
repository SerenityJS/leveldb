
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "leveldb_upgrade"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.3.0", default-features = false, features = ["napi4"] }
napi-derive = "3.0.0"
rusty-leveldb = "4.0.0"
once_cell = "1"
miniz_oxide = "0.8.9"


[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
